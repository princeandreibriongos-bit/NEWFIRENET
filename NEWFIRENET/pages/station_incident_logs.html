<section class="logs-pro" aria-labelledby="stationLogsTitle">
  <div class="logs-page-bg" aria-hidden="true"></div>

  <header class="logs-hero">
    <div class="logs-hero-copy">
      <p class="logs-hero-kicker" id="stationLogsKicker">Fire out archive</p>
      <h1 id="stationLogsTitle">Incident Logs</h1>
      <p class="logs-hero-desc" id="stationLogsSummary">Loading logs…</p>
    </div>
    <div class="logs-hero-stats" aria-label="Log summary">
      <article class="logs-stat">
        <span class="logs-stat-label">Fire out cases</span>
        <strong class="logs-stat-value" id="stationLogsTotal">0</strong>
      </article>
      <article class="logs-stat logs-stat--scope">
        <span class="logs-stat-label">Scope</span>
        <strong class="logs-stat-value logs-stat-value--scope" id="stationLogsScope">—</strong>
      </article>
    </div>
  </header>

  <section class="logs-toolbar" aria-label="Search and filters">
    <div class="logs-toolbar-filters">
      <label class="logs-field logs-field--search">
        <span class="logs-field-label">Search</span>
        <input id="stationLogsSearch" type="search" placeholder="Location, title, user, case…" autocomplete="off">
      </label>
      <label class="logs-field logs-field--case">
        <span class="logs-field-label">Case #</span>
        <input id="stationLogsCaseFilter" type="search" inputmode="numeric" placeholder="42" autocomplete="off">
      </label>
      <label class="logs-field logs-field--station" id="stationLogsStationField">
        <span class="logs-field-label">Station</span>
        <select id="stationLogsStationFilter">
          <option value="">All stations</option>
        </select>
      </label>
      <label class="logs-field logs-field--sort">
        <span class="logs-field-label">Sort</span>
        <select id="stationLogsSortField">
          <option value="date">Date closed</option>
          <option value="name">Incident</option>
          <option value="station">Station</option>
          <option value="submitted_by">Closed by</option>
          <option value="alarm">Alarm</option>
        </select>
      </label>
      <label class="logs-field logs-field--order">
        <span class="logs-field-label">Order</span>
        <select id="stationLogsSortDir">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
      </label>
    </div>
    <div class="logs-toolbar-actions">
      <button type="button" id="stationLogsDownloadCsv" class="logs-btn logs-btn--primary">
        <span aria-hidden="true">↓</span> Export CSV
      </button>
    </div>
  </section>

  <section class="logs-table-panel">
    <div class="logs-table-scroll">
      <table class="logs-table" id="stationLogsTable">
        <thead>
          <tr>
            <th>Closed</th>
            <th>Case</th>
            <th class="logs-col-station">Station</th>
            <th>Incident</th>
            <th>Closed by</th>
            <th>Alarm</th>
            <th><span class="sr-only">Open</span></th>
          </tr>
        </thead>
        <tbody id="stationLogsTableBody">
          <tr>
            <td colspan="7" class="logs-empty">Loading logs…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <div id="stationLogsModal" class="logs-modal" hidden>
    <div class="logs-modal-backdrop" data-close-logs-modal="true"></div>
    <section class="logs-modal-card" role="dialog" aria-modal="true" aria-labelledby="stationLogsModalTitle">
      <header class="logs-modal-head">
        <div>
          <p class="logs-modal-kicker">Case <span id="stationLogsModalCase">—</span> · Fire out</p>
          <h2 id="stationLogsModalTitle">Incident</h2>
          <p id="stationLogsModalMeta" class="logs-modal-meta"></p>
        </div>
        <button type="button" id="closeStationLogsModal" class="logs-modal-close" aria-label="Close timeline">×</button>
      </header>
      <div class="logs-modal-body">
        <dl class="logs-modal-facts">
          <div>
            <dt>Location</dt>
            <dd id="stationLogsModalLocation">—</dd>
          </div>
          <div>
            <dt>Closed by</dt>
            <dd id="stationLogsModalSubmittedBy">—</dd>
          </div>
          <div>
            <dt>Finished at</dt>
            <dd id="stationLogsModalFinishedAt">—</dd>
          </div>
        </dl>
        <div class="logs-timeline-wrap">
          <h3>Timeline</h3>
          <ul id="stationLogsModalTimeline" class="logs-timeline"></ul>
        </div>
      </div>
    </section>
  </div>
</section>
