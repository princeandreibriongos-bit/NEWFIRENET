<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The FireNet News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/css/login.css">
    <style>
        :root {
            --nyt-bg: #f4f1ea;
            --nyt-paper: #fbfaf7;
            --nyt-ink: #111111;
            --nyt-muted: #5b5b5b;
            --nyt-rule: rgba(0, 0, 0, 0.14);
        }

        body {
            background:
                radial-gradient(circle at top, rgba(255,255,255,0.7), transparent 38%),
                linear-gradient(180deg, #f7f4ee 0%, #efe9df 100%);
            color: var(--nyt-ink);
        }

        .page-bg {
            filter: none;
            opacity: 0.06;
            mix-blend-mode: multiply;
        }

        .news-shell {
            min-height: 100vh;
            width: min(1280px, 94vw);
            margin: 0 auto;
            padding: 18px 0 28px;
        }

        .news-nyt-header {
            position: sticky;
            top: 12px;
            z-index: 10;
            margin-bottom: 16px;
            background: rgba(250, 247, 241, 0.88);
            border: 1px solid rgba(0, 0, 0, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        .news-nyt-header-inner {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
            padding: 14px 18px 10px;
        }

        .news-nyt-logo {
            grid-column: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .news-nyt-logo-title {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: clamp(30px, 4vw, 52px);
            line-height: 0.98;
            letter-spacing: -0.04em;
            color: #0d0d0d;
        }

        .news-nyt-logo-sub {
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--nyt-muted);
        }

        .news-nyt-back {
            justify-self: end;
            color: #111;
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            border-bottom: 1px solid rgba(0,0,0,0.26);
            padding-bottom: 3px;
        }

        .news-nyt-back:hover {
            border-bottom-color: rgba(188, 31, 45, 0.85);
        }

        .news-nyt-rule {
            height: 6px;
            background: linear-gradient(90deg, #111 0%, #111 25%, #bc1f2d 50%, #243f61 75%, #111 100%);
        }

        .news-nyt-content {
            padding-top: 14px;
        }

        .news-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
            gap: 18px;
            align-items: start;
        }

        .news-card {
            background: var(--nyt-paper);
            color: var(--nyt-ink);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .news-feature {
            padding: 18px;
        }

        .news-feature-kicker {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-weight: 800;
            color: #111;
        }

        .news-feature-grid {
            display: grid;
            grid-template-columns: minmax(280px, 1.15fr) minmax(0, 0.85fr);
            gap: 18px;
            align-items: start;
            margin-top: 12px;
        }

        .news-feature-media {
            position: relative;
            overflow: hidden;
            min-height: 360px;
            background: #ddd;
            border: 1px solid var(--nyt-rule);
        }

        .news-feature-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .news-feature-title {
            margin: 0 0 12px;
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: clamp(28px, 2.8vw, 44px);
            line-height: 1.02;
            letter-spacing: -0.04em;
            color: #111;
        }

        .news-feature-body {
            margin: 0;
            color: #222;
            line-height: 1.75;
            font-size: 15px;
            font-family: Georgia, 'Times New Roman', serif;
            line-clamp: 6;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-feature-meta {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            color: var(--nyt-muted);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .news-list {
            padding: 0;
        }

        .news-list-head {
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--nyt-rule);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .news-list-head h2 {
            margin: 0;
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 20px;
            letter-spacing: -0.02em;
            color: #111;
            font-weight: 700;
        }

        .news-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .news-pill {
            font-size: 11px;
            color: #111;
            border: 1px solid rgba(0, 0, 0, 0.18);
            background: rgba(255, 255, 255, 0.72);
            border-radius: 999px;
            padding: 6px 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        #newsList {
            display: grid;
            grid-template-columns: 1fr;
        }

        .news-row {
            display: grid;
            grid-template-columns: 1fr 86px;
            gap: 14px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--nyt-rule);
            text-decoration: none;
            cursor: pointer;
            color: inherit;
            align-items: start;
            transition: background 0.18s ease;
        }

        .news-row:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        .news-row-title {
            margin: 0;
            color: #111;
            font-family: 'Libre Baskerville', Georgia, serif;
            font-weight: 700;
            font-size: 16px;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        .news-row-sub {
            margin: 7px 0 0;
            color: #404040;
            font-size: 13px;
            line-height: 1.55;
            font-family: Georgia, 'Times New Roman', serif;
            line-clamp: 3;

            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-row-meta {
            color: var(--nyt-muted);
            font-size: 11px;
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-end;
            justify-content: center;
            min-width: 86px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .news-row-thumb {
            width: 86px;
            height: 86px;
            overflow: hidden;
            background: #d6d6d6;
            border: 1px solid var(--nyt-rule);
        }

        .news-row-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .news-error {
            padding: 18px;
            color: #111;
        }

        .news-detail-card {
            padding: 18px;
        }

        .news-detail-body {
            margin-top: 16px;
            white-space: pre-wrap;
            margin: 0;
            color: #222;
            line-height: 1.8;
            font-size: 15px;
            font-family: Georgia, 'Times New Roman', serif;
        }

        .btn-login {
            background: linear-gradient(90deg, #111 0%, #111 42%, #bc1f2d 70%, #243f61 100%);
            color: #fff;
            border: 0;
            box-shadow: none;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
        }

        @media (max-width: 960px) {
            .news-shell {
                width: min(980px, 94vw);
            }

            .news-layout {
                grid-template-columns: 1fr;
            }

            .news-feature-grid {
                grid-template-columns: 1fr;
            }

            .news-feature-media {
                min-height: 260px;
            }
        }

        @media (max-width: 640px) {
            .news-nyt-header {
                top: 8px;
            }

            .news-nyt-header-inner {
                grid-template-columns: 1fr;
                justify-items: center;
            }

            .news-nyt-logo {
                grid-column: auto;
            }

            .news-nyt-back {
                justify-self: center;
            }

            .news-row {
                grid-template-columns: 1fr 72px;
                padding: 12px 14px;
            }

            .news-row-thumb {
                width: 72px;
                height: 72px;
            }
        }
    </style>
</head>

<body>
    <div class="page-bg" aria-hidden="true"></div>

    <main class="news-shell" aria-label="News" style="min-height: 100vh; width: 100%; padding: 0;">
        <header class="news-nyt-header" aria-label="The FireNet News header">
            <div class="news-nyt-header-inner">
                <div class="news-nyt-logo">
                    <span class="news-nyt-logo-title">The FireNet News</span>
                    <span class="news-nyt-logo-sub">Latest updates from Makati Fire District</span>
                </div>

                <a class="news-nyt-back" href="../pages/login.html" aria-label="Back to Login">
                    Back to Login
                </a>
            </div>
            <div class="news-nyt-rule" aria-hidden="true"></div>
        </header>

        <div class="news-nyt-content" aria-label="News content">

            <div class="news-layout" id="newsListMode">
                <div class="news-card news-feature">
                    <div class="news-feature-kicker">
                        <span class="login-news-pulse" id="newsPulse" aria-hidden="true" style="width:10px;height:10px;"></span>
                        <span>Featured</span>
                    </div>

                    <div class="news-feature-grid">
                        <div class="news-feature-media">
                            <img id="newsFeaturedImage" alt="" style="display:none;">
                        </div>
                        <div>
                            <div class="news-feature-title" id="newsFeaturedTitle">Loading…</div>
                            <p class="news-feature-body" id="newsFeaturedBody"></p>
                            <div class="news-feature-meta" id="newsFeaturedMeta"></div>

                            <div style="margin-top: 12px;">
                                <a id="newsFeaturedLink" class="btn-login" href="#" style="text-decoration:none;">
                                    <span class="btn-text">Read article</span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="news-card news-list">
                    <div class="news-list-head">
                        <h2>All updates</h2>
                        <div class="news-badges">
                            <span class="news-pill" id="newsCountPill">—</span>
                        </div>
                    </div>

                    <div id="newsList" aria-label="News list">
                        <div class="news-row" style="border-bottom: none;">
                            <div>
                                <p class="news-row-title" style="margin-top:0;">Loading…</p>
                                <p class="news-row-sub" style="margin-bottom:0;">Fetching the latest items.</p>
                            </div>
                            <div class="news-row-meta" style="min-width: 140px;">&nbsp;</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="newsDetailMode" style="display:none; margin-top: 18px;">
                <div class="news-card news-detail-card">
                    <div style="display:flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items:center;">
                        <div>
                            <p class="overline" style="margin:0 0 6px;">Article</p>
                            <h2 id="newsDetailTitle" style="margin:0; color:#f4f7ff; letter-spacing:-0.02em;">Loading…</h2>
                            <p id="newsDetailMeta" style="margin: 6px 0 0; color: rgba(217,230,250,0.78); font-size: 12.5px;"></p>
                        </div>

                        <div style="display:flex; gap:10px; flex-wrap:wrap;">
                            <a class="btn-login" href="../pages/news.html" style="text-decoration:none;">
                                <span class="btn-text">Back to list</span>
                            </a>
                        </div>
                    </div>

                    <div style="margin-top: 14px;">
                        <img id="newsDetailImage" alt="" style="display:none; width:100%; max-height: 420px; object-fit: cover; border-radius:14px; border:1px solid rgba(0,0,0,0.05);">
                    </div>

                    <div class="news-detail-body">
                        <p id="newsDetailBody" style="margin:0;"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            'use strict';

            const ENDPOINT_LIST = '/firenet/NEWFIRENET/backend/controllers/news.php?action=list&limit=10';
            const ENDPOINT_GET_BASE = '/firenet/NEWFIRENET/backend/controllers/news.php?action=get&newsId=';

            const newsPulse = document.getElementById('newsPulse');

            const featuredTitleEl = document.getElementById('newsFeaturedTitle');
            const featuredBodyEl = document.getElementById('newsFeaturedBody');
            const featuredMetaEl = document.getElementById('newsFeaturedMeta');
            const featuredImgEl = document.getElementById('newsFeaturedImage');
            const featuredLinkEl = document.getElementById('newsFeaturedLink');

            const newsCountPill = document.getElementById('newsCountPill');
            const newsListEl = document.getElementById('newsList');

            const listModeEl = document.getElementById('newsListMode');
            const detailModeEl = document.getElementById('newsDetailMode');
            const detailTitleEl = document.getElementById('newsDetailTitle');
            const detailMetaEl = document.getElementById('newsDetailMeta');
            const detailImgEl = document.getElementById('newsDetailImage');
            const detailBodyEl = document.getElementById('newsDetailBody');

            function getQueryParam(name) {
                const params = new URLSearchParams(window.location.search);
                return params.get(name);
            }

            function formatDate(s) {
                if (!s) return '';
                const d = new Date(s);
                if (Number.isNaN(d.getTime())) return '';
                return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: '2-digit' });
            }

            function truncateText(str, maxChars) {
                const s = String(str ?? '').trim();
                if (!s) return '';
                if (s.length <= maxChars) return s;
                return s.slice(0, Math.max(0, maxChars - 1)).trimEnd() + '…';
            }

            function configureLink(linkEl, item) {
                const articleUrl = String(item?.articleUrl || '').trim();
                const newsId = item?.newsId ? String(item.newsId) : '';

                if (articleUrl) {
                    linkEl.href = articleUrl;
                    linkEl.target = '_blank';
                    linkEl.rel = 'noopener noreferrer';
                    return;
                }

                linkEl.removeAttribute('target');
                linkEl.removeAttribute('rel');

                if (newsId) {
                    linkEl.href = '/firenet/NEWFIRENET/pages/news.html?newsId=' + encodeURIComponent(newsId);
                } else {
                    linkEl.href = '#';
                }
            }

            function setFeatured(item) {
                if (!item) return;

                featuredTitleEl.textContent = item.title || 'Breaking Update';
                featuredBodyEl.textContent = truncateText(item.body || '', 200);

                const created = item.createdAt ? formatDate(item.createdAt) : '';
                featuredMetaEl.textContent = created ? 'Published: ' + created : '';

                if (item.imageUrl) {
                    featuredImgEl.src = item.imageUrl;
                    featuredImgEl.style.display = 'block';
                    featuredImgEl.alt = (item.title || 'News') + ' image';
                } else {
                    featuredImgEl.style.display = 'none';
                }

                configureLink(featuredLinkEl, item);
            }

            function renderList(items) {
                newsListEl.innerHTML = '';

                if (!Array.isArray(items) || items.length === 0) {
                    newsListEl.innerHTML = `
                        <div class="news-row" style="border-bottom:none;">
                            <div>
                                <p class="news-row-title" style="margin-top:0;">No updates yet</p>
                                <p class="news-row-sub" style="margin-bottom:0;">Check back later.</p>
                            </div>
                            <div class="news-row-meta" style="min-width:140px;">&nbsp;</div>
                        </div>`;
                    return;
                }

                newsCountPill.textContent = items.length + ' items';

                items.forEach((item) => {
                    const a = document.createElement('a');
                    a.className = 'news-row';
                    a.setAttribute('aria-label', 'Open news: ' + (item.title || ''));
                    configureLink(a, item);

                    const left = document.createElement('div');
                    const titleEl = document.createElement('p');
                    titleEl.className = 'news-row-title';
                    titleEl.textContent = item.title ? String(item.title) : 'Breaking Update';

                    const bodyEl = document.createElement('p');
                    bodyEl.className = 'news-row-sub';
                    bodyEl.textContent = truncateText(item.body || '', 160);

                    left.appendChild(titleEl);
                    left.appendChild(bodyEl);

                    const meta = document.createElement('div');
                    meta.className = 'news-row-meta';
                    const created = item.createdAt ? formatDate(item.createdAt) : '';

                    const createdEl = document.createElement('div');
                    createdEl.textContent = created || '';

                    const thumbEl = document.createElement('div');
                    thumbEl.className = 'news-row-thumb';

                    if (item.imageUrl) {
                        const imgEl = document.createElement('img');
                        imgEl.src = item.imageUrl;
                        imgEl.alt = 'thumbnail';
                        thumbEl.appendChild(imgEl);
                    }

                    meta.appendChild(createdEl);
                    meta.appendChild(thumbEl);

                    a.appendChild(left);
                    a.appendChild(meta);
                    newsListEl.appendChild(a);
                });
            }

            function setDetail(data) {
                detailTitleEl.textContent = data.title || 'Breaking Update';
                detailMetaEl.textContent = data.createdAt ? ('Published: ' + new Date(data.createdAt).toLocaleString()) : '';
                detailBodyEl.textContent = data.body || 'Details will be provided soon.';

                if (data.imageUrl) {
                    detailImgEl.src = data.imageUrl;
                    detailImgEl.style.display = 'block';
                    detailImgEl.alt = (data.title || 'News') + ' image';
                } else {
                    detailImgEl.style.display = 'none';
                }
            }

            async function loadDetailIfRequested() {
                const newsId = getQueryParam('newsId');
                if (!newsId) return false;

                listModeEl.style.display = 'none';
                detailModeEl.style.display = 'block';

                const res = await fetch(ENDPOINT_GET_BASE + encodeURIComponent(newsId), {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-store'
                });

                let payload = null;
                try { payload = await res.json(); } catch (e) {}

                if (!res.ok || !payload || payload.ok !== true || !payload.data) {
                    throw new Error((payload && payload.message) ? payload.message : 'Failed to load news.');
                }

                setDetail(payload.data);
                return true;
            }

            async function loadAll() {
                if (newsPulse) newsPulse.hidden = false;

                const res = await fetch(ENDPOINT_LIST, {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-store'
                });

                let payload = null;
                try { payload = await res.json(); } catch (e) {}

                if (!res.ok || !payload || payload.ok !== true || !payload.data || !Array.isArray(payload.data.items)) {
                    throw new Error((payload && payload.message) ? payload.message : 'Failed to load news list.');
                }

                const items = payload.data.items;
                const featured = items[0] || null;
                if (featured) setFeatured(featured);
                renderList(items);
            }

            (async function () {
                try {
                    const loadedDetail = await loadDetailIfRequested();
                    if (!loadedDetail) {
                        await loadAll();
                    }
                } catch (err) {
                    // Minimal fallback: show an error in list mode.
                    if (listModeEl) listModeEl.style.display = 'block';
                    if (detailModeEl) detailModeEl.style.display = 'none';

                    if (newsListEl) {
                        newsListEl.innerHTML = '<div class="news-err news-error">Could not load news: ' + (err && err.message ? err.message : String(err)) + '</div>';
                    }
                }
            })();
        })();
    </script>
</body>
</html>
