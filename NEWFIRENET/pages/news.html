<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIRENET - News</title>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var next = new URL('/firenet/NEWFIRENET/pages/login.html', window.location.origin);
            next.searchParams.set('view', 'news');
            var newsId = params.get('newsId');
            if (newsId) next.searchParams.set('newsId', newsId);
            window.location.replace(next.pathname + next.search);
        })();
    </script>
    <meta http-equiv="refresh" content="0;url=/firenet/NEWFIRENET/pages/login.html?view=news">
</head>
<body>
    <p style="font-family: system-ui, sans-serif; padding: 2rem; color: #243047;">
        Opening FireNet news…
        <a href="/firenet/NEWFIRENET/pages/login.html?view=news">Continue</a>
    </p>
</body>
</html>
